[pytest]
pythonpath = .
testpaths = tests
# --durations=5 shows the slowest steps.
# -p no:faulthandler hides a harmless "Windows fatal exception: access violation" that pyarrow
# prints on Windows while it loads (the tests still pass).
addopts = --durations=5 -p no:faulthandler
filterwarnings = ignore::DeprecationWarning
